<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri Planner for intervals.icu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#12232e;--mute:#5d707c;--line:#d5dee3;--swim:#1a9bc4;--bike:#e0a21b;--run:#e0583f;--str:#7b6bb5;--acc:#12232e;--accfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a22;--card:#16262f;--ink:#e6eef2;--mute:#8fa4b0;--line:#27404c;--acc:#e6eef2;--accfg:#0e1a22}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
header{padding:20px 24px 0;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font:700 28px 'Barlow Condensed',Barlow,sans-serif;margin:0;letter-spacing:.2px}
h2{font:700 20px 'Barlow Condensed',Barlow,sans-serif;margin:0 0 10px}
nav{display:flex;gap:4px;padding:14px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:600 15px Barlow,sans-serif;padding:8px 14px;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--swim)}
main{max-width:1000px;margin:0 auto;padding:20px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
button.b{background:var(--acc);color:var(--accfg);border:0;border-radius:6px;padding:9px 16px;font:600 15px Barlow,sans-serif;cursor:pointer;flex:0 0 auto}
button.b.s{background:none;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--swim);outline-offset:2px}
.stats{display:flex;gap:28px;flex-wrap:wrap}.stat b{display:block;font:700 30px 'Barlow Condensed',sans-serif}.stat span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;color:var(--mute);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.msg{padding:10px 12px;border-radius:6px;background:var(--bg);border-left:4px solid var(--swim);margin-bottom:14px}.msg.err{border-color:var(--run)}
.wk{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;padding:4px 0;cursor:pointer}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--bg)}
.sw{background:var(--swim)}.rd{background:var(--bike)}.rn{background:var(--run)}.st{background:var(--str)}
.ph{font-size:12px;color:var(--mute)}.dim{color:var(--mute)}.hide{display:none}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin:6px 0 12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.days label{display:inline-flex;gap:5px;align-items:center;margin-right:14px;color:var(--ink)}.days>label:first-child{display:block;color:var(--mute)}.days input{width:auto}.gen{background:var(--mute);opacity:.4}.cur{background:var(--bg);border-radius:6px}ul.why{margin:6px 0 0;padding-left:20px}.wk{cursor:default}
.lg{display:inline-flex;align-items:center;gap:6px;margin-right:18px;font-weight:600}.lg i{width:18px;height:3px;border-radius:2px;display:inline-block}svg.tr{width:100%;height:auto;display:block}.ax{fill:var(--mute);font:11px Barlow,system-ui,sans-serif}
</style></head><body>
<header><h1>Tri Planner</h1><span class="dim">Reads your intervals.icu data and builds a plan back from race day</span></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=LS('cfg')||{id:'',key:''}, goals=LS('goals')||[], sel=LS('sel')||'', plan=LS('plan'), wk=LS('wk')||{}, viewWs='', data=LS('data')||null, tab='home', note=null;
const DIST={sprint:{n:'Sprint',peak:6,taper:1},olympic:{n:'Olympic',peak:8,taper:1},half:{n:'70.3 / Half',peak:12,taper:2},full:{n:'Ironman / Full',peak:16,taper:3}};
const MAP={Swim:'Swim',Ride:'Ride',Run:'Run',Strength:'WeightTraining'};
const CLS={Swim:'sw',Ride:'rd',Run:'rn',Strength:'st'};
const TPL=[{dw:1,sport:'Swim',kind:'Threshold set',share:.55,cap:1.25,pin:1},{dw:1,sport:'Run',kind:'Easy run',share:.2,cap:1.25},{dw:2,sport:'Ride',kind:'Bike intervals',share:.35,cap:1.25},{dw:3,sport:'Run',kind:'Run quality',share:.25,cap:1.25},{dw:3,sport:'Strength',kind:'Strength + mobility',share:1,cap:1},{dw:4,sport:'Swim',kind:'Endurance swim',share:.45,cap:1.25,pin:1},{dw:5,sport:'Ride',kind:'Long ride',share:.65,cap:3.5,pin:1},{dw:5,sport:'Run',kind:'Brick run',share:.15,cap:1,pin:1},{dw:6,sport:'Run',kind:'Long run',share:.4,cap:2.5,pin:1}];
const SWIM={'Threshold set':'Fins for drills, then threshold repeats. Add paddles and a pull buoy for the pull block.','Endurance swim':'Steady aerobic swim. Alternate swim, pull (buoy and paddles) and kick (fins) blocks.'};
function alloc(l,total){let a=l.map(s=>total*s.share),fx=l.map(()=>false);for(let p=0;p<4;p++){let ex=0;a.forEach((v,i)=>{if(v>l[i].cap){ex+=v-l[i].cap;a[i]=l[i].cap;fx[i]=true}});if(ex<.001)break;const fr=l.map((s,i)=>fx[i]?0:s.share),fs=fr.reduce((x,y)=>x+y,0);if(!fs)break;a=a.map((v,i)=>v+ex*fr[i]/fs)}return a.map((v,i)=>Math.min(v,l[i].cap))}
const NOTES={Base:'Mostly Z2, steady and conversational. Build volume, keep it easy.',Build:'Add structured intensity: threshold and sweet-spot work, then easy aerobic.',Peak:'Race-specific work at goal pace or power, with full recovery between efforts.',Taper:'Cut volume, keep a little sharpness. Short openers, finish fresh.',Recovery:'Absorb training. Keep it easy.'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtH=h=>Math.floor(h)+'h'+String(Math.round((h%1)*60)).padStart(2,'0');
function mon(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+((8-x.getDay())%7||7));return x} // next Monday
function thisMon(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

async function api(path,opt={}){
  const r=await fetch('https://intervals.icu/api/v1/athlete/'+encodeURIComponent(cfg.id)+path,{...opt,headers:{Authorization:'Basic '+btoa('API_KEY:'+cfg.key),'Content-Type':'application/json'}});
  if(!r.ok)throw new Error('intervals.icu returned '+r.status+(r.status==401||r.status==403?' (check athlete ID and API key)':''));
  return r.json();
}
async function sync(){
  if(!cfg.id||!cfg.key){note=['err','Add your athlete ID and API key first.'];return render()}
  note=['','Syncing…'];render();
  try{
    const t=new Date(),o=iso(addD(t,-45));
    const [ev,act,wel]=await Promise.all([
      api('/events?oldest='+iso(t)+'&newest='+iso(addD(t,400))),
      api('/activities?oldest='+o+'&newest='+iso(t)),
      api('/wellness?oldest='+o+'&newest='+iso(t)).catch(()=>[])]);
    const races=ev.filter(e=>(e.category||'').startsWith('RACE')).map(e=>({id:e.id,name:e.name,date:(e.start_date_local||'').slice(0,10),pri:(e.category||'RACE_B').slice(-1)}));
    const w=wel.filter(x=>x.ctl!=null).pop()||{};
    const ser=wel.filter(x=>x.ctl!=null&&x.atl!=null).map(x=>({d:x.id||x.date,ctl:x.ctl,atl:x.atl}));
    const cut=addD(t,-28),by={Swim:0,Ride:0,Run:0,Other:0};let tot=0;
    act.forEach(a=>{if(new Date(a.start_date_local)<cut)return;const h=(a.moving_time||0)/3600,ty=a.type||'';tot+=h;
      by[/Swim/.test(ty)?'Swim':/Ride|Cycl/.test(ty)?'Ride':/Run/.test(ty)?'Run':'Other']+=h});
    data={races,series:ser,ctl:w.ctl,atl:w.atl,wkH:tot/4,by:Object.fromEntries(Object.entries(by).map(([k,v])=>[k,v/4])),at:new Date().toLocaleString()};
    SV('data',data);note=['','Synced '+act.length+' activities and '+races.length+' upcoming races.'];
  }catch(e){note=['err',e.message+'. If it says "Failed to fetch", the browser could not reach intervals.icu: open this file directly (not inside a sandbox) and check your connection.']}
  render();
}
function guess(n){n=(n||'').toLowerCase();return /ironman 70|70\.3|half/.test(n)?'half':/ironman|full|140/.test(n)?'full':/olymp|standard|51\.5/.test(n)?'olympic':'sprint'}
function importRaces(){
  (data?.races||[]).forEach(r=>{if(!goals.some(g=>g.eventId===r.id))goals.push({id:'g'+r.id,eventId:r.id,type:'race',name:r.name,date:r.date,pri:r.pri,dist:guess(r.name),focus:''})});
  save();render();
}
function save(){SV('goals',goals);SV('sel',sel)}
function addGoal(){
  const f=id=>$('#'+id).value,type=f('gt');
  if(!f('gn').trim())return;
  const g={id:'g'+Date.now(),type,name:f('gn').trim(),date:f('gd'),focus:f('gf')};
  if(type=='race'){if(!g.date)return;g.pri=f('gp');g.dist=f('gx')}else{g.metric=f('gm');}
  goals.push(g);save();render();
}
function delGoal(id){goals=goals.filter(g=>g.id!=id);if(sel==id)sel='';save();render()}

function build(){
  const races=goals.filter(g=>g.type=='race'&&g.date).sort((a,b)=>a.date.localeCompare(b.date));
  const A=races.find(g=>g.id==sel)||races.find(g=>g.pri=='A'&&new Date(g.date)>new Date())||races[0];
  if(!A){note=['err','Add or import a race goal first.'];return render()}
  const rd=new Date(A.date+'T00:00:00'),start=thisMon(new Date()),weeks=Math.floor((rd-start)/6048e5)+1;
  if(weeks<3){note=['err','That race is too close for a structured plan (need 3+ weeks).'];return render()}
  if(plan&&plan.raceId!=A.id){wk={};SV('wk',wk)}
  const D=DIST[A.dist],pk=Math.min(D.peak,10.5),h0=Math.max(3,Math.min(data?.wkH||4,pk*.8)),taper=Math.min(D.taper,weeks-1);
  const inW=(ds,w)=>{const d=new Date(ds+'T00:00:00');return d>=w&&d<addD(w,7)};
  const out=[];let prev=h0;
  for(let w=0;w<weeks;w++){
    const ws=addD(start,w*7),left=weeks-1-w,bw=weeks-taper-1;let phase;
    if(left<taper)phase='Taper';else if(left<taper+Math.max(1,Math.round(.2*(weeks-taper))))phase='Peak';else phase=w<bw*.45?'Base':'Build';
    let h=h0+(pk-h0)*Math.min(1,w/Math.max(1,bw-1));
    h=Math.min(h,prev*1.12);
    if(phase=='Taper'){const k=taper-left;h=pk*(taper==1?.55:[.7,.5,.35][Math.min(k,2)]);if(left==0)h*=.7}
    else if((w+1)%4==0&&phase!='Peak'){h*=.7;phase='Recovery'}else prev=h;
    const mini=goals.find(g=>g.id!=A.id&&g.type=='race'&&g.pri!='A'&&g.date&&inW(g.date,ws));
    if(mini&&phase!='Taper')h*=mini.pri=='B'?.7:.88;
    if(goals.some(g=>g.type!='race'&&g.focus&&g.date&&inW(g.date,ws)))h*=.9;
    out.push({ws:iso(ws),phase,h:Math.round(h*4)/4,mini:mini?mini.name:''});
  }
  plan={raceId:A.id,race:{name:A.name,date:A.date,dist:A.dist},capped:D.peak>pk,weeks:out};SV('plan',plan);
  viewWs=iso(start);tab='plan';note=null;render();
}
async function doCheckin(){
  const ws=viewWs,prev=iso(addD(new Date(ws+'T00:00:00'),-7));
  const ci={feel:+$('#cf').value,protect:$('#cp').value,hrs:parseFloat($('#ch').value)||0,off:[...document.querySelectorAll('.cd:checked')].map(e=>+e.value),note:$('#cn').value,at:iso(new Date())};
  const pw=wk[prev],psk=plan.weeks.find(w=>w.ws==prev);
  ci.prevPlanned=pw?pw.workouts.reduce((a,w)=>a+w.hrs,0):(psk?psk.h:0);ci.prevAct=null;
  if(psk&&cfg.id&&cfg.key){try{const a=await api('/activities?oldest='+prev+'&newest='+iso(addD(new Date(ws+'T00:00:00'),-1)));ci.prevAct=a.reduce((s,x)=>s+(x.moving_time||0),0)/3600}catch(e){}}
  genWeek(ws,ci);note=null;render();
}
function genWeek(ws,ci){
  const i=plan.weeks.findIndex(w=>w.ws==ws),sk=plan.weeks[i],wsd=new Date(ws+'T00:00:00'),rd=new Date(plan.race.date+'T00:00:00'),why=[];
  let h=sk.h;
  why.push('Target race: '+plan.race.name+', '+(plan.weeks.length-1-i)+' weeks out. '+sk.phase+' phase, about '+fmtH(sk.h)+' planned.');
  if(ci.prevAct!=null&&ci.prevPlanned>1&&ci.prevAct/ci.prevPlanned<.75&&sk.phase!='Taper'){h=Math.min(h,Math.max(ci.prevAct*1.05,2));why.push('You completed '+Math.round(ci.prevAct/ci.prevPlanned*100)+'% of last week, so volume stays close to what you actually did.')}
  const easy=ci.feel<=2;
  if(easy){h*=.8;why.push('You feel '+(ci.feel==1?'drained':'tired')+', so hours are cut 20% and hard sessions are made easy.')}
  if(ci.hrs&&ci.hrs<h){h=ci.hrs;why.push('Hours capped at the '+ci.hrs+' you have available.')}
  const split={Swim:.2,Ride:.45,Run:.25,Strength:.1},key={},tests=[],raceD=new Set();
  goals.forEach(g=>{
    if(g.id==plan.raceId)return;
    const d=g.date?new Date(g.date+'T00:00:00'):null;
    if(g.type=='race'&&d){
      if(d>=addD(wsd,-7)&&d<wsd&&g.pri!='A'){h*=.85;why.push(g.name+' was last week, so this week is a bit lighter to recover.')}
      if(d>=wsd&&d<addD(wsd,7)){raceD.add((d.getDay()+6)%7);why.push(g.name+' ('+g.pri+' race) is this week: no training on race day and easy sessions in the 2 days before.')}
    }
    if(d&&d<wsd)return;
    if(g.focus&&split[g.focus]!=null){
      const wt=!d||d<addD(wsd,42)?.06:.03;split[g.focus]+=wt;Object.keys(split).forEach(k=>{if(k!=g.focus)split[k]-=wt/3});
      if(!key[g.focus])key[g.focus]=g;
      why.push(g.name+': more '+g.focus.toLowerCase()+' time and a goal-specific '+g.focus.toLowerCase()+' session.');
      if(g.type!='race'&&d&&d<addD(wsd,7))tests.push(g);
    }else if(g.type!='race')why.push(g.name+' is tracked, but with no sport selected it does not change the workouts.');
  });
  Object.keys(split).forEach(k=>split[k]=Math.max(.05,split[k]));
  const sm=Object.values(split).reduce((a,b)=>a+b,0);Object.keys(split).forEach(k=>split[k]/=sm);
  if(ci.protect&&split[ci.protect]){const sub={Swim:'Ride',Ride:'Swim',Run:'Ride'}[ci.protect];split[sub]+=split[ci.protect];split[ci.protect]=0;why.push('No '+ci.protect.toLowerCase()+' sessions this week because you are protecting a niggle. That time goes to '+sub.toLowerCase()+'.')}
  const off=new Set(ci.off),t=new Date();t.setHours(0,0,0,0);
  for(let dw=0;dw<7;dw++)if(addD(wsd,dw)<t)off.add(dw);
  const left=[0,1,2,3,4,5,6].filter(d=>addD(wsd,d)>=t).length;
  if(left<7&&left>0){h*=Math.max(left/7,.3);why.push('Only '+left+' day(s) of this week are left, so hours are scaled down to match.')}
  const planned=h,cnt={},ok=dw=>dw>=1&&dw<=6&&!off.has(dw)&&!raceD.has(dw)&&addD(wsd,dw)<rd&&(cnt[dw]||0)<2;
  const dropped=[],wo=[],hrsOf=new Map(),bySp={};
  TPL.forEach(s=>(bySp[s.sport]=bySp[s.sport]||[]).push(s));
  Object.entries(bySp).forEach(([sp,l])=>{const a=alloc(l,h*split[sp]);l.forEach((s,i)=>hrsOf.set(s,a[i]))});
  TPL.forEach(s=>{
    const hrs=hrsOf.get(s);if(hrs<.2)return;
    const cand=s.pin?[s.dw]:[1,2,3,4].sort((x,y)=>Math.abs(x-s.dw)-Math.abs(y-s.dw)||x-y);
    for(const dw of cand){if(ok(dw)){cnt[dw]=(cnt[dw]||0)+1;wo.push({dw,date:iso(addD(wsd,dw)),sport:s.sport,kind:s.kind,cap:s.cap,hrs:Math.round(hrs*4)/4,desc:(s.sport=='Swim'?SWIM[s.kind]+' ':'')+NOTES[sk.phase]});return}}
    dropped.push(s.kind);
  });
  if(dropped.length)why.push('No available day for: '+dropped.join(', ')+'. Swims stay on Tuesday and Friday, and the long ride and long run stay on the weekend.');
  const got=wo.reduce((a,w)=>a+w.hrs,0);
  if(planned-got>.5)why.push('Your session limits and fixed days hold this week to '+fmtH(got)+' of about '+fmtH(planned)+' planned.');
  const hard=/interval|threshold|quality/i,ez=new Set();raceD.forEach(r=>{ez.add(r-1);ez.add(r-2)});
  wo.forEach(w=>{if((easy||ez.has(w.dw))&&hard.test(w.kind)){w.kind='Easy aerobic';w.desc='Kept easy to protect recovery.'+(w.sport=='Swim'?' Use the pull buoy or fins.':'')}});
  const Q={Swim:'Threshold set',Ride:'Bike intervals',Run:'Run quality',Strength:'Strength + mobility'};
  wo.forEach(w=>{const g=key[w.sport];if(g&&w.kind==Q[w.sport]){w.kind+=' for goal: '+g.name;w.desc+=' Goal target: '+(g.metric||g.name)+'.'}});
  tests.forEach(g=>{
    if(easy){why.push('The test for '+g.name+' is postponed because you feel tired.');return}
    const c=wo.filter(w=>w.sport==g.focus).sort((a,b)=>b.hrs-a.hrs)[0];
    if(c){c.kind='Goal test: '+g.name;c.desc='Benchmark effort for '+(g.metric||g.name)+'. Warm up well, then go for it.'}
  });
  wo.sort((a,b)=>a.date.localeCompare(b.date));
  wk[ws]={ci,why,workouts:wo,sent:''};SV('wk',wk);
}
function setHrs(i,v){const x=parseFloat(v),w=wk[viewWs].workouts[i];if(x>0){w.hrs=Math.min(Math.round(x*4)/4,w.cap||9);SV('wk',wk)}render()}
function rmW(i){wk[viewWs].workouts.splice(i,1);SV('wk',wk);render()}
function redo(){if(wk[viewWs]?.sent&&!confirm('This week was already sent to intervals.icu. Redoing it and sending again may create duplicate workouts. Continue?'))return;delete wk[viewWs];SV('wk',wk);render()}
async function push(){
  const W=wk[viewWs];if(!W||!W.workouts.length)return;
  if(!confirm('Add '+W.workouts.length+' workouts to your intervals.icu calendar?'))return;
  const ev=W.workouts.map((w,i)=>({category:'WORKOUT',start_date_local:w.date+'T00:00:00',type:MAP[w.sport],name:w.kind,description:w.desc,moving_time:Math.round(w.hrs*3600),external_id:'triplan-'+w.date+'-'+w.sport+'-'+i}));
  note=['','Sending…'];render();
  try{await api('/events/bulk',{method:'POST',body:JSON.stringify(ev)});W.sent=iso(new Date());SV('wk',wk);note=['','Sent '+ev.length+' workouts to intervals.icu.']}catch(e){note=['err','Could not send: '+e.message]}
  render();
}

const TABS={home:'Overview',goals:'Goals',plan:'Plan'};
function render(){
  $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');
  $('#main').innerHTML=(note?`<div class="msg ${note[0]}">${esc(note[1])}</div>`:'')+({home,goals:goalsView,plan:planView}[tab])();
}
function trend(s){
  if(!s||s.length<2)return '<p class="dim">No trend data yet. Select Save and sync to load the last 45 days.</p>';
  const W=640,H=340,L=34,R=12,n=s.length,sx=(W-L-R)/(n-1),x=i=>L+i*sx,f=s.map(p=>p.ctl-p.atl);
  const rng=(a,lo0,hi0)=>{let lo=Math.floor(Math.min(...a,lo0)/10)*10,hi=Math.ceil(Math.max(...a,hi0)/10)*10;if(hi==lo)hi+=10;return[lo,hi]};
  const [l1,h1]=rng(s.flatMap(p=>[p.ctl,p.atl]),1e9,-1e9),[l2,h2]=rng(f,0,0);
  const T1=12,H1=170,T2=222,H2=90,y=(v,t,h,lo,hi)=>(t+h-(v-lo)/(hi-lo)*h).toFixed(1);
  const path=(a,t,h,lo,hi)=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v,t,h,lo,hi)).join('');
  const grid=(t,h,lo,hi,ticks)=>ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v,t,h,lo,hi)}" y2="${y(v,t,h,lo,hi)}" stroke="var(--line)" ${v==0&&lo<0?'stroke-dasharray="4 3" stroke-width="1.5"':''}/><text class="ax" x="${L-6}" y="${+y(v,t,h,lo,hi)+4}" text-anchor="end">${v}</text>`).join('');
  const mid1=Math.round((l1+h1)/20)*10,tk2=[...new Set([l2,0,h2])];
  const dl=(i,a)=>`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${a}">${esc((s[i].d||'').slice(5))}</text>`;
  const last=s[n-1],lf=Math.round(last.ctl-last.atl);
  const hit=s.map((p,i)=>`<rect x="${(x(i)-sx/2).toFixed(1)}" y="${T1}" width="${sx.toFixed(1)}" height="${T2+H2-T1}" fill="transparent"><title>${esc(p.d)}: fitness ${Math.round(p.ctl)}, fatigue ${Math.round(p.atl)}, form ${Math.round(p.ctl-p.atl)}</title></rect>`).join('');
  return `<div style="margin-bottom:6px"><span class="lg"><i style="background:var(--swim)"></i>Fitness (CTL) ${Math.round(last.ctl)}</span><span class="lg"><i style="background:var(--run)"></i>Fatigue (ATL) ${Math.round(last.atl)}</span><span class="lg"><i style="background:var(--str)"></i>Form (TSB) ${lf>0?'+':''}${lf}</span></div>
  <svg class="tr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fitness, fatigue and form over the last ${n} days">
  ${grid(T1,H1,l1,h1,[l1,mid1,h1])}${grid(T2,H2,l2,h2,tk2)}
  <path d="${path(s.map(p=>p.ctl),T1,H1,l1,h1)}" fill="none" stroke="var(--swim)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="${path(s.map(p=>p.atl),T1,H1,l1,h1)}" fill="none" stroke="var(--run)" stroke-width="2" stroke-dasharray="6 3" stroke-linejoin="round"/>
  <path d="${path(f,T2,H2,l2,h2)}" fill="none" stroke="var(--str)" stroke-width="2.5" stroke-linejoin="round"/>
  ${dl(0,'start')}${dl(Math.floor((n-1)/2),'middle')}${dl(n-1,'end')}${hit}</svg>
  <p class="dim" style="margin:6px 0 0">Form is fitness minus fatigue. Below zero you are carrying fatigue, above zero you are fresh. Hover a day for its values.</p>`;
}
function home(){
  const d=data;
  return `<div class="card"><h2>Connect to intervals.icu</h2><div class="row">
  <div><label for="cid">Athlete ID</label><input id="cid" value="${esc(cfg.id)}" placeholder="i123456"></div>
  <div><label for="ckey">API key</label><input id="ckey" type="password" value="${esc(cfg.key)}" autocomplete="off"></div>
  <button class="b" onclick="cfg={id:$('#cid').value.trim(),key:$('#ckey').value.trim()};SV('cfg',cfg);sync()">Save and sync</button></div>
  <p class="dim" style="margin:10px 0 0">Stored only in this browser. Find the key under Settings, Developer Settings in intervals.icu.</p></div>`+
  (d?`<div class="card"><h2>Fitness, fatigue and form, last 45 days</h2>${trend(d.series)}</div>
  <div class="card"><h2>Your last 4 weeks</h2><div class="stats">
  <div class="stat"><b>${fmtH(d.wkH)}</b><span>Hours per week</span></div>
  <div class="stat"><b>${fmtH(d.by.Swim)}</b><span>Swim</span></div><div class="stat"><b>${fmtH(d.by.Ride)}</b><span>Bike</span></div><div class="stat"><b>${fmtH(d.by.Run)}</b><span>Run</span></div></div>
  <p class="dim" style="margin:10px 0 0">Synced ${esc(d.at)}. The plan starts from your weekly hours.</p></div>
  <div class="card"><h2>Races on your calendar</h2>${d.races.length?`<table>${d.races.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td><span class="tag">${r.pri} race</span></td></tr>`).join('')}</table>
  <p style="margin:12px 0 0"><button class="b s" onclick="importRaces();tab='goals';render()">Import as goals</button></p>`:'<p class="dim">No races found. Add races in intervals.icu with category Race, or create a race goal here.</p>'}</div>`:'');
}
function goalsView(){
  const races=goals.filter(g=>g.type=='race'),other=goals.filter(g=>g.type!='race');
  const dsel=`<select id="gx">${Object.entries(DIST).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select>`;
  return `<div class="card"><h2>New goal</h2><div class="row">
  <div><label for="gt">Type</label><select id="gt" onchange="document.querySelectorAll('.r').forEach(e=>e.classList.toggle('hide',this.value!='race'));document.querySelectorAll('.o').forEach(e=>e.classList.toggle('hide',this.value=='race'))"><option value="race">Race</option><option value="other">Not a race</option></select></div>
  <div style="flex:2 1 220px"><label for="gn">Name</label><input id="gn" placeholder="Race name, or e.g. Swim 1500 m in 24:00"></div>
  <div><label for="gd">Date</label><input id="gd" type="date"></div></div>
  <div class="row" style="margin-top:12px">
  <div class="r"><label for="gp">Priority</label><select id="gp"><option>A</option><option selected>B</option><option>C</option></select></div>
  <div class="r"><label for="gx">Distance</label>${dsel}</div>
  <div class="o hide"><label for="gm">Target</label><input id="gm" placeholder="e.g. FTP 260 W, 5 k in 21:00"></div>
  <div><label for="gf">Sport for this goal</label><select id="gf"><option value="">None</option><option value="Swim">Swim</option><option value="Ride">Bike</option><option value="Run">Run</option><option value="Strength">Strength</option></select></div>
  <button class="b" onclick="addGoal()">Add goal</button></div></div>
  <div class="card"><h2>Race goals</h2>${races.length?`<table><tr><th></th><th>Date</th><th>Race</th><th>Distance</th><th></th></tr>${races.map(g=>`<tr><td><input type="radio" name="tgt" aria-label="Plan around this race" ${g.id==sel?'checked':''} style="width:auto" onchange="sel='${g.id}';save()"></td><td>${esc(g.date)}</td><td>${esc(g.name)} <span class="tag">${g.pri}</span></td>
  <td><select onchange="goals.find(x=>x.id=='${g.id}').dist=this.value;save()">${Object.entries(DIST).map(([k,v])=>`<option value="${k}" ${g.dist==k?'selected':''}>${v.n}</option>`).join('')}</select></td><td><button class="x" aria-label="Delete" onclick="delGoal('${g.id}')">×</button></td></tr>`).join('')}</table>
  <p class="dim" style="margin:10px 0 12px">Select the race to plan around. If none is selected, the next A race is used. B and C races inside the plan trigger a mini-taper.</p>
  <button class="b" onclick="build()">Build plan</button>`:'<p class="dim">No race goals yet. Add one above or import from your calendar on the Overview tab.</p>'}</div>
  <div class="card"><h2>Other goals</h2>${other.length?`<table>${other.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.metric||'')}</td><td>${esc(g.date||'')}</td><td>${g.focus?`<span class="tag">${g.focus} focus</span>`:''}</td><td><button class="x" aria-label="Delete" onclick="delGoal('${g.id}')">×</button></td></tr>`).join('')}</table>
  <p class="dim" style="margin:10px 0 0">Every goal is considered when each week is created. A sport shifts hours toward it and adds a goal-specific session, and a goal with a date gets a test session in its week.</p>`:'<p class="dim">Goals like a swim time, a bike power target or a body composition target go here.</p>'}</div>`;
}
const WD=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'});
function planView(){
  if(!plan)return '<div class="card"><p>No plan yet. Choose a race on the Goals tab and select Build plan.</p></div>';
  const cur=iso(thisMon(new Date())),nxt=iso(addD(thisMon(new Date()),7));
  if(!viewWs)viewWs=cur;
  const sk=plan.weeks.find(w=>w.ws==viewWs),W=wk[viewWs];
  const tg=(ws,l)=>`<button class="b ${viewWs==ws?'':'s'}" onclick="viewWs='${ws}';render()">${l}</button>`;
  let h=`<div class="card"><h2>${esc(plan.race.name)}, ${esc(plan.race.date)}</h2><p class="dim" style="margin:0 0 12px">${DIST[plan.race.dist].n}, ${plan.weeks.length} weeks. Workouts are created one week at a time after your Monday check-in.</p><p class="dim" style="margin:0 0 12px">Fixed rules: Monday rest, pool on Tuesday and Friday, weekday workouts up to 75 min, long ride Saturday (3h30 max), long run Sunday (2h30 max).${plan.capped?' These limits cap weekly volume at about 10h30, which is less than this distance usually calls for.':''}</p><div class="row">${tg(cur,'This week')}${tg(nxt,'Next week')}</div></div>`;
  if(!sk)h+='<div class="card"><p>That week is outside the plan.</p></div>';
  else if(!W)h+=checkin(sk);
  else h+=preview(sk,W);
  return h+outline(cur);
}
function checkin(sk){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return `<div class="card"><h2>Weekly check-in, week of ${sk.ws.slice(5)}</h2>
  <p class="dim" style="margin:0 0 12px">${sk.phase} phase, about ${fmtH(sk.h)} planned. Your answers and all your goals shape this week's workouts.</p>
  <div class="row"><div><label for="cf">How do you feel?</label><select id="cf"><option value="1">Drained</option><option value="2">Tired</option><option value="3" selected>OK</option><option value="4">Good</option><option value="5">Great</option></select></div>
  <div><label for="cp">Protect a sport (niggle)</label><select id="cp"><option value="">None</option><option value="Swim">Swim</option><option value="Ride">Bike</option><option value="Run">Run</option></select></div>
  <div><label for="ch">Hours available (optional)</label><input id="ch" type="number" step=".5" min="0"></div></div>
  <div class="days" style="margin:14px 0"><label>Days you cannot train</label>${days.map((d,i)=>`<label><input type="checkbox" class="cd" value="${i}">${d}</label>`).join('')}</div>
  <div style="margin-bottom:14px"><label for="cn">Notes</label><input id="cn" placeholder="Travel, sleep, anything that matters this week"></div>
  <button class="b" onclick="doCheckin()">Create this week's workouts</button></div>`;
}
function preview(sk,W){
  const tot=W.workouts.reduce((a,w)=>a+w.hrs,0);
  return `<div class="card"><h2>Week of ${sk.ws.slice(5)}: ${fmtH(tot)} in ${W.workouts.length} workouts</h2>
  <p class="dim" style="margin:0 0 10px">Review and edit below. Nothing reaches intervals.icu until you send it.</p>
  <b>How your goals shaped this week</b><ul class="why">${W.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card"><table><tr><th>Day</th><th>Workout</th><th>Hours</th><th></th></tr>${W.workouts.map((w,i)=>`<tr><td style="width:120px">${esc(WD.format(new Date(w.date+'T00:00:00')))}</td><td><span class="tag">${w.sport}</span> ${esc(w.kind)}<div class="dim">${esc(w.desc)}</div></td><td style="width:90px"><input type="number" step=".25" min=".25" value="${w.hrs}" aria-label="Hours" onchange="setHrs(${i},this.value)"></td><td style="width:30px"><button class="x" aria-label="Remove workout" onclick="rmW(${i})">×</button></td></tr>`).join('')}</table>
  <div class="row" style="margin-top:14px"><button class="b" onclick="push()">${W.sent?'Send again':'Send to intervals.icu'}</button><button class="b s" onclick="redo()">Redo check-in</button>${W.sent?`<span class="dim">Sent on ${esc(W.sent)}.</span>`:''}</div></div>`;
}
function outline(cur){
  const mx=Math.max(...plan.weeks.map(w=>w.h));
  return `<div class="card"><h2>Season outline</h2><p class="dim" style="margin:0 0 10px">Target hours per week. Detailed workouts appear after each check-in.</p>${plan.weeks.map(w=>{
    const W=wk[w.ws],by={};if(W)W.workouts.forEach(d=>by[d.sport]=(by[d.sport]||0)+d.hrs);
    const tot=W?Object.values(by).reduce((a,b)=>a+b,0):w.h;
    return `<div class="wk ${w.ws==cur?'cur':''}"><div>${w.ws.slice(5)}${W?' ✓':''}<div class="ph">${w.phase}${w.mini?', mini-taper':''}</div></div>
    <div class="bar" style="width:${Math.max(tot,.2)/mx*100}%">${W?['Swim','Ride','Run','Strength'].map(s=>`<div class="${CLS[s]}" style="width:${(by[s]||0)/tot*100}%"></div>`).join(''):'<div class="gen" style="width:100%"></div>'}</div><div>${fmtH(tot)}</div></div>`}).join('')}</div>`;
}
render();if(plan)tab='plan',render();else if(cfg.id&&cfg.key&&!data)sync();
</script></body></html>
