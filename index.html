<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriPulse – Triathlon Training Planner</title>
<link rel="icon" type="image/svg+xml" href="">
<style>
:root{--bg:#0b1020;--card:#141b30;--card2:#1b2440;--line:#27325a;--tx:#e8ecff;--mut:#8b97c4;--acc:#22d3ee;--acc2:#8b5cf6;--swim:#38bdf8;--bike:#f59e0b;--run:#34d399;--oth:#a78bfa;--bad:#fb7185;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1d1b4b55,transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(10px);z-index:10;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:42px;height:42px;filter:drop-shadow(0 4px 12px #22d3ee55)}
.brand h1{margin:0;font-size:24px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:-4px}
.sp{flex:1}
#status{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
#status i{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
#status.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}#status.err i{background:var(--bad)}
nav{display:flex;gap:8px;padding:14px 24px 0;max-width:1240px;margin:0 auto;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mut);padding:10px 18px;border-radius:10px 10px 0 0;font-weight:600;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;transition:all .15s}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--tx);border-color:var(--acc);background:#141b3066}
main{padding:20px 24px 60px;max-width:1240px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 20px #00000025}
.card h2{margin:0 0 14px;font-size:16px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card2);border-radius:14px;padding:14px;border:1px solid var(--line)}
.kpi b{font-size:26px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.kpi em{font-style:normal;font-size:12px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.swim{--c:var(--swim)}.bike{--c:var(--bike)}.run{--c:var(--run)}.strength,.other{--c:var(--oth)}.race{--c:#f472b6}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px;text-transform:uppercase;letter-spacing:.8px}
input,select,textarea{width:100%;background:#0d1328;border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.btn{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#04101f;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.alt{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.alt:hover{background:#232d50}
.btn.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.bar{height:8px;background:#0d1328;border-radius:6px;overflow:hidden;margin-top:6px}.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.goal{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:16px;margin-bottom:12px}
.goal h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#22d3ee22;color:var(--acc);font-weight:700}.tag.r{background:#f472b622;color:#f472b6}
.muted{color:var(--mut)}.small{font-size:13px}
.week{border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:14px;overflow:hidden}
.ph{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;letter-spacing:.5px}
.ph.Base{background:#38bdf822;color:#38bdf8}.ph.Build{background:#f59e0b22;color:#f59e0b}.ph.Peak{background:#fb718522;color:#fb7185}.ph.Taper{background:#34d39922;color:#34d399}.ph.Race{background:#f472b633;color:#f472b6}.ph.Recover{background:#a78bfa22;color:#a78bfa}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.day{background:var(--card2);padding:10px;min-height:96px;font-size:12px}
.day h4{margin:0 0 6px;font-size:11px;color:var(--mut);font-weight:600}
.chip{border-left:3px solid var(--c);background:#0d1328cc;border-radius:6px;padding:5px 7px;margin-bottom:6px}
.chip b{font-size:12px}.chip p{margin:2px 0 0;color:var(--mut);font-size:11px;line-height:1.3}
@media(max-width:860px){.days{grid-template-columns:1fr}.day{min-height:0}}
.hide{display:none}
.chip pre{white-space:pre-wrap;font-size:11px;background:#0d1328;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 0;overflow-x:auto}
.chip details summary{list-style:revert}
.kpi svg{display:block;margin:4px 0}
.dp{display:flex;gap:8px;flex-wrap:wrap}
.dp label{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--tx)}
.dp input{width:auto}
.due{background:linear-gradient(90deg,#22d3ee22,#8b5cf622);border:1px solid var(--acc);border-radius:14px;padding:12px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
nav button.due::after{content:' ●';color:var(--acc);border:0}
details.card>summary{cursor:pointer;font-weight:700}
.chip summary{cursor:pointer;list-style:none}.chip summary::-webkit-details-marker{display:none}
.chip summary input{width:auto;vertical-align:middle;margin-right:6px}
.blk{display:grid;grid-template-columns:82px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:12px}
.tg{color:var(--acc);margin-top:2px}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.why li{margin-bottom:4px}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.tot span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
.note{background:#8b5cf61a;border:1px solid #8b5cf655;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.cloud-pill{font-size:11px;background:#22d3ee14;border:1px solid #22d3ee44;color:var(--acc);padding:4px 10px;border-radius:14px;display:inline-flex;align-items:center;gap:5px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span id="logo"></span>
    <div><h1>TriPulse</h1><small>Swim · Bike · Run</small></div>
  </div>
  <div class="sp"></div>
  <div id="cloudStatus" class="cloud-pill" onclick="navTo('settings')">☁ Connect Cloud</div>
  <div id="status"><i></i><span>Not connected</span></div>
</header>
<nav>
  <button id="btn-dash" class="on" onclick="navTo('dash')">Dashboard</button>
  <button id="btn-goals" onclick="navTo('goals')">Goals</button>
  <button id="btn-plan" onclick="navTo('plan')">Check-in</button>
  <button id="btn-settings" onclick="navTo('settings')">⚙ Settings &amp; Cloud</button>
</nav>
<main>
  <div id="dueBanner"></div>

  <!-- Dashboard -->
  <section class="tab on" id="dash"></section>
